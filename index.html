<body>
<div id="root"></div>
<div id="bank-feed-control" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:1000;font-family:Trebuchet MS,Segoe UI,system-ui,sans-serif"></div>
<script>
(function(){
  const API = '/api/plaid';
  const el = document.getElementById('bank-feed-control');
  let connected = false;
  let busy = false;

  function button(label, onClick, muted){
    const b=document.createElement('button');
    b.textContent=label;
    b.onclick=onClick;
    b.disabled=busy;
    b.style.cssText='border:0;border-radius:999px;padding:9px 13px;font-weight:700;font-size:12px;box-shadow:0 5px 18px rgba(60,55,45,.18);background:'+(muted?'#EEEAE2':'#2F6F5E')+';color:'+(muted?'#5B4A55':'#fff')+';';
    return b;
  }
  function render(message){
    el.innerHTML='';
    if(message){
      const m=document.createElement('div');
      m.textContent=message;
      m.style.cssText='font-size:11px;color:#5B4A55;background:rgba(255,255,255,.94);padding:6px 9px;border-radius:10px;margin-bottom:6px;max-width:220px;box-shadow:0 3px 12px rgba(0,0,0,.08)';
      el.appendChild(m);
    }
    el.appendChild(button(connected ? (busy?'Syncing…':'↻ Sync bank') : (busy?'Opening…':'＋ Connect bank'), connected ? sync : connect, false));
  }
  async function jfetch(url, options){
    const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options&&options.headers||{})},...options});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||data.message||('Request failed: '+r.status));
    return data;
  }
  async function status(){
    try{
      const x=await jfetch(API+'/status');
      connected=!!x.connected;
      render();
      if(connected) await sync(true);
    }catch(e){
      render('Bank server not running');
    }
  }
  async function connect(){
    if(busy)return; busy=true; render();
    try{
      const x=await jfetch(API+'/link-token',{method:'POST',body:'{}'});
      const handler=Plaid.create({
        token:x.link_token,
        onSuccess:async function(public_token,metadata){
          try{
            await jfetch(API+'/exchange',{method:'POST',body:JSON.stringify({public_token,metadata})});
            connected=true;
            await sync();
          }catch(e){ render('Connect failed: '+e.message); }
        },
        onExit:function(err){ busy=false; render(err ? 'Plaid closed: '+(err.display_message||err.error_message||'error') : ''); }
      });
      handler.open();
    }catch(e){ busy=false; render('Could not start Plaid: '+e.message); }
  }
  async function sync(silent){
    if(busy && !silent)return;
    busy=true; if(!silent)render();
    try{
      const data=await jfetch(API+'/sync',{method:'POST',body:'{}'});
      if(window.__applyBankFeed) window.__applyBankFeed(data);
      connected=true;
      busy=false;
      render(silent?'Bank data updated':('Synced '+(data.tx||[]).length+' new/updated purchases'));
      if(silent) setTimeout(()=>render(),2200);
    }catch(e){ busy=false; render('Sync failed: '+e.message); }
  }
  window.addEventListener('load',()=>setTimeout(status,250));
})();
</script>
