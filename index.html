<body>
<div id="root"></div>

<div
  id="bank-feed-control"
  style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:1000;font-family:Trebuchet MS,Segoe UI,system-ui,sans-serif">
</div>

<script>
(function(){
  const API = '/api/plaid';
  const el = document.getElementById('bank-feed-control');

  let connected = false;
  let busy = false;

  function button(label,onClick,muted){
    const b=document.createElement('button');
    b.textContent=label;
    b.onclick=onClick;
    b.disabled=busy;

    b.style.cssText =
      'border:0;border-radius:999px;padding:9px 13px;' +
      'font-weight:700;font-size:12px;' +
      'box-shadow:0 5px 18px rgba(60,55,45,.18);' +
      'background:'+(muted?'#EEEAE2':'#2F6F5E')+';' +
      'color:'+(muted?'#5B4A55':'#fff')+';';

    return b;
  }

  function render(message){
    el.innerHTML='';

    if(message){
      const m=document.createElement('div');
      m.textContent=message;

      m.style.cssText =
        'font-size:11px;color:#5B4A55;' +
        'background:rgba(255,255,255,.94);' +
        'padding:6px 9px;border-radius:10px;margin-bottom:6px;' +
        'max-width:240px;box-shadow:0 3px 12px rgba(0,0,0,.08)';

      el.appendChild(m);
    }

    el.appendChild(
      button(
        connected
          ? (busy ? 'Syncing…' : '↻ Sync bank')
          : (busy ? 'Opening…' : '＋ Connect bank'),
        connected ? sync : connect,
        false
      )
    );
  }

  async function jfetch(url,options){
    const r=await fetch(url,{
      headers:{
        'Content-Type':'application/json',
        ...(options&&options.headers||{})
      },
      ...options
    });

    const data=await r.json().catch(()=>({}));

    if(!r.ok){
      throw new Error(
        data.error ||
        data.message ||
        ('Request failed: '+r.status)
      );
    }

    return data;
  }

  async function status(){
    try{
      const x=await jfetch(API+'/status');

      connected=!!x.connected;
      render();

      if(connected){
        await sync(true);
      }
    }catch(e){
      render('Bank server not running');
    }
  }

  async function connect(){
    if(busy)return;

    busy=true;
    render();

    try{
      const x=await jfetch(API+'/link-token',{
        method:'POST',
        body:'{}'
      });

      const handler=Plaid.create({
        token:x.link_token,

        onSuccess:async function(public_token,metadata){
          try{
            await jfetch(API+'/exchange',{
              method:'POST',
              body:JSON.stringify({
                public_token,
                metadata
              })
            });

            connected=true;

            /*
             * IMPORTANT:
             * Plaid Link itself had set busy=true.
             * We MUST clear it before calling sync().
             */
            busy=false;

            await sync();

          }catch(e){
            busy=false;
            render('Connect failed: '+e.message);
          }
        },

        onExit:function(err){
          busy=false;

          render(
            err
              ? 'Plaid closed: '+
                (err.display_message||
                 err.error_message||
                 'error')
              : ''
          );
        }
      });

      handler.open();

    }catch(e){
      busy=false;
      render('Could not start Plaid: '+e.message);
    }
  }

  async function sync(silent){
    if(busy&&!silent)return;

    busy=true;

    if(!silent){
      render();
    }

    try{
      const data=await jfetch(API+'/sync',{
        method:'POST',
        body:'{}'
      });

      /*
       * React may not be finished mounting yet.
       * Never discard a successful Plaid response.
       */
      if(window.__applyBankFeed){
        window.__applyBankFeed(data);
      }else{
        window.__pendingBankFeed=data;
      }

      connected=true;
      busy=false;

      const txCount=Array.isArray(data.tx)
        ? data.tx.length
        : 0;

      const acctCount=Array.isArray(data.accounts)
        ? data.accounts.length
        : 0;

      const waiting=
        data.transactionsStatus==='NOT_READY';

      const msg=waiting
        ? (
            'Connected '+acctCount+
            ' account'+(acctCount===1?'':'s')+
            '; transactions are still loading'
          )
        : (
            'Synced '+acctCount+
            ' account'+(acctCount===1?'':'s')+
            ' and '+txCount+
            ' purchases'
          );

      render(msg);

      setTimeout(
        ()=>render(),
        waiting ? 5000 : 3000
      );

    }catch(e){
      busy=false;
      render('Sync failed: '+e.message);
    }
  }

  window.addEventListener(
    'load',
    ()=>setTimeout(status,350)
  );
})();
</script>

<script>
const {
  useState,
  useEffect,
  useRef
}=React;

const C={
  bg:"#F7F4ED",
  ink:"#1F3A2E",
  soft:"#7E8A80",
  line:"#E9E3D7",
  card:"#FFFDF9",
  green:"#2E5545",
  greenSoft:"#E2EBE4",
  amber:"#D9A73F",
  amberSoft:"#F7EEDA",
  red:"#B4523F",
  redSoft:"#F6E5E0",
  ledger:"#2E5545",
  gold:"#E0B457"
};

const FONT={
  fontFamily:
    "-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Segoe UI',system-ui,sans-serif"
};

const NUM={
  fontVariantNumeric:"tabular-nums"
};

const uid=()=>
  Math.random().toString(36).slice(2,9);

const pad=n=>
  String(n).padStart(2,"0");

const today=()=>{
  const d=new Date();

  return (
    d.getFullYear()+
    "-"+
    pad(d.getMonth()+1)+
    "-"+
    pad(d.getDate())
  );
};

const mKey=s=>
  (s||"").slice(0,7);

const money=n=>
  (n<0?"-$":"$")+
  Math.abs(
    Math.round(Number(n||0)*100)/100
  ).toLocaleString("en-US",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

const money0=n=>
  (n<0?"-$":"$")+
  Math.abs(
    Math.round(Number(n||0))
  ).toLocaleString("en-US");

const num=v=>{
  const n=Number(v);
  return isNaN(n)?0:n;
};

const monthLabel=k=>{
  if(!k)return "";

  const [y,m]=k.split("-").map(Number);

  return new Date(
    y,
    m-1,
    1
  ).toLocaleDateString(
    "en-US",
    {
      month:"long",
      year:"numeric"
    }
  );
};

const addMonths=(k,n)=>{
  const [y,m]=k.split("-").map(Number);

  const d=new Date(
    y,
    m-1+n,
    1
  );

  return (
    d.getFullYear()+
    "-"+
    pad(d.getMonth()+1)
  );
};

/*
 * Blank starting state.
 * NO personal financial information is stored here.
 */
const SEED={
  tx:[],

  budget:[
    {
      cat:"Rent",
      group:"Housing",
      amt:0,
      note:""
    },
    {
      cat:"Utilities",
      group:"Housing",
      amt:0,
      note:""
    },
    {
      cat:"Groceries",
      group:"Food",
      amt:0,
      note:""
    },
    {
      cat:"Eating Out / Date Nights",
      group:"Food",
      amt:0,
      note:""
    },
    {
      cat:"Gas",
      group:"Transportation",
      amt:0,
      note:""
    },
    {
      cat:"Transportation",
      group:"Transportation",
      amt:0,
      note:""
    },
    {
      cat:"Car Maintenance",
      group:"Transportation",
      amt:0,
      note:""
    },
    {
      cat:"Car Insurance",
      group:"Transportation",
      amt:0,
      note:""
    },
    {
      cat:"Health / Medical",
      group:"Personal",
      amt:0,
      note:""
    },
    {
      cat:"Household Misc",
      group:"Personal",
      amt:0,
      note:""
    },
    {
      cat:"Subscriptions",
      group:"Personal",
      amt:0,
      note:""
    },
    {
      cat:"Fun Money",
      group:"Personal",
      amt:0,
      note:""
    },
    {
      cat:"Vacation / Travel",
      group:"Personal",
      amt:0,
      note:""
    }
  ],

  income:[],
  debts:[],
  sinking:[],
  subs:[],
  networth:[],
  events:[],

  setup:{
    goal:0,
    growth:0,
    plannedSave:0,
    moveSaves:0,
    moveMonth:"",
    dedRate:0,
    rateD:0,
    rateH:0
  },

  bankSync:{
    connected:false,
    lastSync:null,
    institution:null
  }
};

const fresh=()=>({
  ...JSON.parse(
    JSON.stringify(SEED)
  ),

  budget:SEED.budget.map(b=>({
    ...b,
    id:uid()
  })),

  seedV:3
});

/*
 * Separate storage key so an older version of Money HQ
 * cannot reload old seeded personal data.
 */
const STORAGE_KEY=
  "moneyhq-plaid-blank-v3";

const Card=({
  children,
  style
})=>React.createElement(
  "div",
  {
    className:"rounded-2xl p-4 mb-3",
    style:{
      background:C.card,
      border:`1px solid ${C.line}`,
      ...style
    }
  },
  children
);

const Btn=({
  children,
  onClick,
  tone="green",
  style
})=>React.createElement(
  "button",
  {
    onClick,
    className:
      "rounded-full font-bold text-sm px-4 py-2",
    style:{
      background:
        tone==="green"
          ? C.green
          : "#fff",

      color:
        tone==="green"
          ? "#fff"
          : C.green,

      border:
        tone==="green"
          ? "none"
          : `1px solid ${C.line}`,

      ...style
    }
  },
  children
);

const Stat=({
  label,
  value,
  sub
})=>React.createElement(
  "div",
  {
    className:"rounded-2xl px-3 py-3",
    style:{
      background:C.card,
      border:`1px solid ${C.line}`,
      flex:"1 1 44%",
      minWidth:0
    }
  },

  React.createElement(
    "div",
    {
      className:"text-xs truncate",
      style:{color:C.soft}
    },
    label
  ),

  React.createElement(
    "div",
    {
      className:
        "text-lg font-bold truncate",

      style:{
        color:C.ink,
        ...NUM
      }
    },
    value
  ),

  sub&&React.createElement(
    "div",
    {
      className:"text-xs truncate",
      style:{color:C.soft}
    },
    sub
  )
);

function App(){

  const [st,setSt]=useState(null);

  const [tab,setTab]=useState(
    "Home"
  );

  const [month,setMonth]=useState(
    mKey(today())
  );

  const saveTimer=
    useRef(null);

  /*
   * Load local app preferences/state.
   *
   * Bank credentials are NOT stored here.
   * Plaid access tokens remain server-side.
   */
  useEffect(()=>{

    try{
      const raw=
        localStorage.getItem(
          STORAGE_KEY
        );

      if(raw){
        setSt(
          JSON.parse(raw)
        );
      }else{
        setSt(
          fresh()
        );
      }

    }catch(e){
      console.error(e);

      setSt(
        fresh()
      );
    }

  },[]);

  /*
   * Save UI state locally.
   */
  useEffect(()=>{

    if(!st)return;

    clearTimeout(
      saveTimer.current
    );

    saveTimer.current=
      setTimeout(()=>{

        try{
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(st)
          );
        }catch(e){
          console.error(e);
        }

      },400);

  },[st]);

  /*
   * Plaid -> Money HQ bridge.
   */
  useEffect(()=>{

    window.__applyBankFeed=
      payload=>{

        if(!payload)return;

        setSt(prev=>{

          /*
           * If React's local state has not loaded yet,
           * hold onto the successful Plaid response.
           */
          if(!prev){
            window.__pendingBankFeed=
              payload;

            return prev;
          }

          const incomingTx=
            Array.isArray(payload.tx)
              ? payload.tx
              : [];

          const incomingAccounts=
            Array.isArray(
              payload.accounts
            )
              ? payload.accounts
              : [];

          /*
           * Prevent the same Plaid transaction from
           * being added twice on future syncs.
           */
          const existingPlaidIds=
            new Set(
              (prev.tx||[])
                .map(t=>t.plaidId)
                .filter(Boolean)
            );

          const newTx=
            incomingTx
              .filter(
                t=>
                  !t.plaidId ||
                  !existingPlaidIds
                    .has(t.plaidId)
              )
              .map(t=>({
                id:uid(),

                date:
                  t.date ||
                  today(),

                amt:
                  num(t.amt),

                cat:
                  t.cat ||
                  "Household Misc",

                who:
                  t.who ||
                  "Joint",

                desc:
                  t.desc ||
                  t.name ||
                  t.merchant ||
                  "Bank transaction",

                pay:
                  t.pay ||
                  t.accountName ||
                  "Bank",

                note:
                  t.note ||
                  "Plaid",

                plaidId:
                  t.plaidId ||
                  t.transaction_id ||
                  null
              }));

          /*
           * Replace previously synced versions of
           * these bank accounts with the newest balances.
           */
          const incomingIds=
            new Set(
              incomingAccounts
                .map(
                  a=>
                    a.plaidAccountId ||
                    a.account_id
                )
                .filter(Boolean)
            );

          const keptAccounts=
            (prev.networth||[])
              .filter(a=>{

                const id=
                  a.plaidAccountId ||
                  a.account_id;

                if(!id)return true;

                return !incomingIds.has(id);
              });

          const bankAccounts=
            incomingAccounts.map(a=>{

              const accountId=
                a.plaidAccountId ||
                a.account_id ||
                null;

              /*
               * Support several possible server response
               * property names so the UI does not remain
               * blank just because the API field name differs.
               */
              const accountName=
                a.acct ||
                a.name ||
                a.official_name ||
                a.accountName ||
                "Bank Account";

              let balance=
                a.bal;

              if(
                balance===undefined ||
                balance===null
              ){
                balance=
                  a.current;
              }

              if(
                balance===undefined ||
                balance===null
              ){
                balance=
                  a.balance;
              }

              if(
                balance===undefined ||
                balance===null
              ){
                balance=
                  a.balances &&
                  (
                    a.balances.current ??
                    a.balances.available
                  );
              }

              return {
                id:uid(),

                acct:
                  accountName,

                cat:
                  a.cat ||
                  a.subtype ||
                  a.type ||
                  "Bank account",

                bal:
                  num(balance),

                plaidAccountId:
                  accountId,

                institution:
                  a.institution ||
                  payload.institution ||
                  "Bank",

                asOf:
                  today(),

                house:false
              };
            });

          return {
            ...prev,

            tx:[
              ...(prev.tx||[]),
              ...newTx
            ],

            networth:[
              ...keptAccounts,
              ...bankAccounts
            ],

            bankSync:{
              connected:true,

              lastSync:
                payload.syncedAt ||
                new Date()
                  .toISOString(),

              institution:
                payload.institution ||
                prev.bankSync
                  ?.institution ||
                "Bank",

              accountCount:
                bankAccounts.length,

              transactionCount:
                incomingTx.length
            }
          };
        });
      };

  },[]);

  /*
   * If Plaid finished before React was mounted,
   * consume that saved response now.
   */
  useEffect(()=>{

    if(
      !st ||
      !window.__pendingBankFeed ||
      !window.__applyBankFeed
    ){
      return;
    }

    const payload=
      window.__pendingBankFeed;

    window.__pendingBankFeed=null;

    window.__applyBankFeed(
      payload
    );

  },[st]);

  if(!st){

    return React.createElement(
      "div",
      {
        className:
          "min-h-screen flex items-center justify-center",

        style:{
          background:C.bg,
          color:C.soft,
          ...FONT
        }
      },
      "Loading Money HQ…"
    );
  }

  const transactions=
    st.tx||[];

  const accounts=
    st.networth||[];

  const monthTx=
    transactions.filter(
      t=>
        mKey(t.date)===month
    );

  const spent=
    monthTx.reduce(
      (sum,t)=>
        sum+
        Math.max(
          0,
          num(t.amt)
        ),
      0
    );

  const accountTotal=
    accounts.reduce(
      (sum,a)=>
        sum+
        num(a.bal),
      0
    );

  const currentMonthLabel=
    monthLabel(month);

  function Home(){

    return React.createElement(
      "div",
      null,

      React.createElement(
        "div",
        {
          className:
            "mb-4"
        },

        React.createElement(
          "div",
          {
            style:{
              fontSize:11,
              letterSpacing:1.6,
              fontWeight:700,
              color:C.soft
            }
          },
          "YOUR MONEY HQ"
        ),

        React.createElement(
          "div",
          {
            style:{
              fontSize:30,
              fontWeight:800,
              color:C.ink,
              lineHeight:1.1,
              marginTop:6
            }
          },
          "Money HQ"
        )
      ),

      React.createElement(
        Card,
        {
          style:{
            background:C.green,
            border:"none"
          }
        },

        React.createElement(
          "div",
          {
            className:"text-xs",
            style:{
              color:
                "rgba(255,255,255,.75)"
            }
          },
          "CONNECTED ACCOUNT BALANCE"
        ),

        React.createElement(
          "div",
          {
            style:{
              fontSize:42,
              fontWeight:800,
              color:"#fff",
              marginTop:4,
              ...NUM
            }
          },
          money0(accountTotal)
        ),

        React.createElement(
          "div",
          {
            className:"text-sm mt-2",
            style:{
              color:
                "rgba(255,255,255,.78)"
            }
          },

          accounts.length
            ? (
                accounts.length+
                " connected account"+
                (accounts.length===1
                  ? ""
                  : "s")
              )
            : "Connect your bank with Plaid"
        )
      ),

      React.createElement(
        "div",
        {
          className:
            "flex gap-3 mb-4"
        },

        React.createElement(
          Stat,
          {
            label:
              currentMonthLabel+
              " SPENDING",

            value:
              money0(spent),

            sub:
              monthTx.length+
              " transaction"+
              (
                monthTx.length===1
                  ? ""
                  : "s"
              )
          }
        ),

        React.createElement(
          Stat,
          {
            label:
              "LAST BANK SYNC",

            value:
              st.bankSync
                ?.lastSync
                ? new Date(
                    st.bankSync.lastSync
                  ).toLocaleTimeString(
                    [],
                    {
                      hour:"numeric",
                      minute:"2-digit"
                    }
                  )
                : "—",

            sub:
              st.bankSync
                ?.institution ||
              "Not connected"
          }
        )
      ),

      React.createElement(
        "div",
        {
          className:
            "text-lg font-bold mb-2",

          style:{
            color:C.ink
          }
        },
        "Accounts"
      ),

      React.createElement(
        Card,
        {
          style:{
            padding:8
          }
        },

        accounts.length===0
          ? React.createElement(
              "div",
              {
                className:
                  "text-sm text-center py-6",

                style:{
                  color:C.soft
                }
              },
              "No bank accounts loaded yet."
            )
          : accounts.map(
              a=>
                React.createElement(
                  "div",
                  {
                    key:a.id,

                    className:
                      "flex items-center justify-between px-2 py-3",

                    style:{
                      borderBottom:
                        `1px solid ${C.line}`
                    }
                  },

                  React.createElement(
                    "div",
                    {
                      className:
                        "min-w-0"
                    },

                    React.createElement(
                      "div",
                      {
                        className:
                          "text-sm font-bold truncate",

                        style:{
                          color:C.ink
                        }
                      },
                      a.acct
                    ),

                    React.createElement(
                      "div",
                      {
                        className:
                          "text-xs truncate",

                        style:{
                          color:C.soft
                        }
                      },
                      a.cat||
                      "Bank account"
                    )
                  ),

                  React.createElement(
                    "div",
                    {
                      className:
                        "text-sm font-bold",

                      style:{
                        color:C.ink,
                        ...NUM
                      }
                    },
                    money(
                      num(a.bal)
                    )
                  )
                )
            )
      ),

      React.createElement(
        "div",
        {
          className:
            "text-lg font-bold mb-2 mt-5",

          style:{
            color:C.ink
          }
        },
        "Recent activity"
      ),

      React.createElement(
        Card,
        {
          style:{
            padding:6
          }
        },

        transactions.length===0
          ? React.createElement(
              "div",
              {
                className:
                  "text-sm text-center py-6",

                style:{
                  color:C.soft
                }
              },
              "No transactions loaded yet."
            )
          : [...transactions]
              .sort(
                (a,b)=>
                  String(b.date)
                    .localeCompare(
                      String(a.date)
                    )
              )
              .slice(0,8)
              .map(
                t=>
                  React.createElement(
                    "div",
                    {
                      key:t.id,

                      className:
                        "flex items-center justify-between gap-3 px-2 py-3",

                      style:{
                        borderBottom:
                          `1px solid ${C.line}`
                      }
                    },

                    React.createElement(
                      "div",
                      {
                        className:
                          "flex-1 min-w-0"
                      },

                      React.createElement(
                        "div",
                        {
                          className:
                            "text-sm truncate",

                          style:{
                            color:C.ink
                          }
                        },

                        t.desc||
                        t.cat||
                        "Transaction"
                      ),

                      React.createElement(
                        "div",
                        {
                          className:
                            "text-xs truncate",

                          style:{
                            color:C.soft
                          }
                        },

                        (
                          t.date||
                          ""
                        ),

                        t.cat
                          ? " · "+t.cat
                          : ""
                      )
                    ),

                    React.createElement(
                      "div",
                      {
                        className:
                          "text-sm font-bold",

                        style:{
                          color:C.ink,
                          ...NUM
                        }
                      },

                      money(
                        num(t.amt)
                      )
                    )
                  )
              )
      )
    );
  }

  function Activity(){

    const sorted=
      [...transactions].sort(
        (a,b)=>
          String(b.date)
            .localeCompare(
              String(a.date)
            )
      );

    return React.createElement(
      "div",
      null,

      React.createElement(
        "div",
        {
          className:
            "flex items-center justify-between mb-3"
        },

        React.createElement(
          "div",
          {
            className:
              "text-2xl font-bold",

            style:{
              color:C.ink
            }
          },
          "Activity"
        ),

        React.createElement(
          "div",
          {
            className:
              "text-sm",

            style:{
              color:C.soft
            }
          },

          sorted.length+
          " transactions"
        )
      ),

      React.createElement(
        Card,
        {
          style:{
            padding:6
          }
        },

        sorted.length===0
          ? React.createElement(
              "div",
              {
                className:
                  "text-sm text-center py-6",

                style:{
                  color:C.soft
                }
              },
              "Connect your bank to import activity."
            )
          : sorted.map(
              t=>
                React.createElement(
                  "div",
                  {
                    key:t.id,

                    className:
                      "flex items-center justify-between gap-3 px-2 py-3",

                    style:{
                      borderBottom:
                        `1px solid ${C.line}`
                    }
                  },

                  React.createElement(
                    "div",
                    {
                      className:
                        "flex-1 min-w-0"
                    },

                    React.createElement(
                      "div",
                      {
                        className:
                          "text-sm truncate",

                        style:{
                          color:C.ink
                        }
                      },

                      t.desc||
                      "Transaction"
                    ),

                    React.createElement(
                      "div",
                      {
                        className:
                          "text-xs truncate",

                        style:{
                          color:C.soft
                        }
                      },

                      (
                        t.date||
                        ""
                      ),

                      t.cat
                        ? " · "+t.cat
                        : "",

                      t.pay
                        ? " · "+t.pay
                        : ""
                    )
                  ),

                  React.createElement(
                    "div",
                    {
                      className:
                        "text-sm font-bold",

                      style:{
                        color:C.ink,
                        ...NUM
                      }
                    },

                    money(
                      num(t.amt)
                    )
                  )
                )
            )
      )
    );
  }

  function Plan(){

    return React.createElement(
      "div",
      null,

      React.createElement(
        "div",
        {
          className:
            "text-2xl font-bold mb-3",

          style:{
            color:C.ink
          }
        },
        "Budget"
      ),

      React.createElement(
        Card,
        {
          style:{
            padding:8
          }
        },

        st.budget.map(
          b=>
            React.createElement(
              "div",
              {
                key:b.id,

                className:
                  "flex items-center justify-between gap-2 px-2 py-3",

                style:{
                  borderBottom:
                    `1px solid ${C.line}`
                }
              },

              React.createElement(
                "div",
                {
                  className:
                    "flex-1 min-w-0"
                },

                React.createElement(
                  "div",
                  {
                    className:
                      "text-sm truncate",

                    style:{
                      color:C.ink
                    }
                  },
                  b.cat
                ),

                React.createElement(
                  "div",
                  {
                    className:
                      "text-xs",

                    style:{
                      color:C.soft
                    }
                  },
                  b.group
                )
              ),

              React.createElement(
                "input",
                {
                  value:
                    b.amt,

                  inputMode:
                    "decimal",

                  style:{
                    width:90,
                    padding:"8px",
                    border:
                      `1px solid ${C.line}`,
                    borderRadius:12,
                    textAlign:"right"
                  },

                  onChange:e=>{

                    const value=
                      e.target.value
                        .replace(
                          /[^0-9.]/g,
                          ""
                        );

                    setSt(prev=>({
                      ...prev,

                      budget:
                        prev.budget.map(
                          x=>
                            x.id===b.id
                              ? {
                                  ...x,
                                  amt:value
                                }
                              : x
                        )
                    }));
                  }
                }
              )
            )
        )
      )
    );
  }

  function Accounts(){

    return React.createElement(
      "div",
      null,

      React.createElement(
        "div",
        {
          className:
            "text-2xl font-bold mb-3",

          style:{
            color:C.ink
          }
        },
        "Accounts"
      ),

      React.createElement(
        Card,
        {
          style:{
            background:C.green,
            border:"none"
          }
        },

        React.createElement(
          "div",
          {
            className:
              "text-xs",

            style:{
              color:
                "rgba(255,255,255,.72)"
            }
          },
          "TOTAL CONNECTED BALANCE"
        ),

        React.createElement(
          "div",
          {
            className:
              "text-2xl font-bold mt-1",

            style:{
              color:"#fff",
              ...NUM
            }
          },

          money(
            accountTotal
          )
        )
      ),

      React.createElement(
        Card,
        {
          style:{
            padding:8
          }
        },

        accounts.length===0
          ? React.createElement(
              "div",
              {
                className:
                  "text-sm text-center py-6",

                style:{
                  color:C.soft
                }
              },
              "No connected accounts yet."
            )
          : accounts.map(
              a=>
                React.createElement(
                  "div",
                  {
                    key:a.id,

                    className:
                      "flex items-center justify-between gap-3 px-2 py-3",

                    style:{
                      borderBottom:
                        `1px solid ${C.line}`
                    }
                  },

                  React.createElement(
                    "div",
                    {
                      className:
                        "flex-1 min-w-0"
                    },

                    React.createElement(
                      "div",
                      {
                        className:
                          "text-sm font-bold truncate",

                        style:{
                          color:C.ink
                        }
                      },

                      a.acct||
                      "Bank Account"
                    ),

                    React.createElement(
                      "div",
                      {
                        className:
                          "text-xs truncate",

                        style:{
                          color:C.soft
                        }
                      },

                      a.institution
                        ? a.institution+
                          " · "
                        : "",

                      a.cat||
                      "Account"
                    )
                  ),

                  React.createElement(
                    "div",
                    {
                      className:
                        "text-sm font-bold",

                      style:{
                        color:C.ink,
                        ...NUM
                      }
                    },

                    money(
                      num(a.bal)
                    )
                  )
                )
            )
      )
    );
  }

  const tabs=[
    "Home",
    "Activity",
    "Budget",
    "Accounts"
  ];

  return React.createElement(
    "div",
    {
      className:
        "min-h-screen",

      style:{
        background:C.bg,
        color:C.ink,
        ...FONT,
        paddingBottom:100
      }
    },

    React.createElement(
      "div",
      {
        className:
          "px-4 pt-6 max-w-2xl mx-auto"
      },

      tab==="Home"&&
        React.createElement(
          Home
        ),

      tab==="Activity"&&
        React.createElement(
          Activity
        ),

      tab==="Budget"&&
        React.createElement(
          Plan
        ),

      tab==="Accounts"&&
        React.createElement(
          Accounts
        )
    ),

    React.createElement(
      "nav",
      {
        style:{
          position:"fixed",
          left:12,
          right:12,
          bottom:
            "calc(env(safe-area-inset-bottom,0px) + 10px)",
          zIndex:50,
          maxWidth:650,
          margin:"0 auto",
          height:68,
          borderRadius:34,
          padding:5,
          display:"flex",
          background:
            "rgba(69,78,72,.90)",
          backdropFilter:
            "blur(24px)",
          WebkitBackdropFilter:
            "blur(24px)",
          boxShadow:
            "0 12px 30px rgba(30,30,25,.25)"
        }
      },

      tabs.map(
        t=>
          React.createElement(
            "button",
            {
              key:t,

              onClick:()=>{
                setTab(t);

                window.scrollTo({
                  top:0
                });
              },

              style:{
                flex:1,
                borderRadius:28,
                fontSize:12,
                fontWeight:700,

                color:
                  tab===t
                    ? "#1F3A2E"
                    : "#fff",

                background:
                  tab===t
                    ? "rgba(255,255,255,.85)"
                    : "transparent"
              }
            },
            t
          )
      )
    )
  );
}

const root=
  ReactDOM.createRoot(
    document.getElementById(
      "root"
    )
  );

root.render(
  React.createElement(App)
);
</script>

</body>
</html>
